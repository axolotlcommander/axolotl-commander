# SPDX-License-Identifier: GPL-3.0-or-later
#
# Pushing a tag vX.Y.Z builds a universal (Apple silicon + Intel) Axolotl Commander.app and
# attaches it to a draft GitHub release as .zip and .dmg with SHA-256 checksums.
#
# Signing runs when these repository secrets exist, notarization when the NOTARY_* ones exist too:
#   MACOS_CERTIFICATE_P12      base64 of the signing certificate (.p12): an Apple "Developer ID
#                              Application" certificate, or the project's self-signed one
#                              (scripts/make-signing-cert.sh)
#   MACOS_CERTIFICATE_PASSWORD password of the .p12
#   MACOS_SIGNING_IDENTITY     e.g. "Developer ID Application: Name (TEAMID)" or
#                              "Axolotl Commander Release Signing"
#   NOTARY_KEY_P8              base64 of an App Store Connect API key (.p8) (Developer ID only)
#   NOTARY_KEY_ID, NOTARY_ISSUER_ID
# Without notarization users must allow the app in System Settings once per download; the
# release notes then start with the steps (.github/release-install.md). A stable certificate
# keeps the folder access users granted across updates, so a release without one is refused.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APP: build/Axolotl Commander.app
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version from tag
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags look like v1.2.3, not $GITHUB_REF_NAME."
            exit 1
          fi
          if [ "${GITHUB_REF_NAME#v}" != "$(cat VERSION)" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the VERSION file ($(cat VERSION))."
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The tagged commit is not on main."
            exit 1
          fi
          # Every release is signed with the same certificate, so users keep the folder access
          # they granted across updates (see docs/RELEASING.md).
          if [ "$HAS_CERT" != true ]; then
            echo "::error::The MACOS_CERTIFICATE_* secrets are not set; releases must be signed."
            exit 1
          fi
          # Every release describes itself in English and Czech (spec 027): stop before the build
          # when either changelog has no notes for the version.
          if ! scripts/changelog-cs-missing.sh "${GITHUB_REF_NAME#v}" >/dev/null || \
             ! scripts/release-notes.sh "${GITHUB_REF_NAME#v}" >/dev/null; then
            echo "::error::CHANGELOG.md or CHANGELOG.cs.md has no notes for ${GITHUB_REF_NAME#v}."
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "ARTIFACT=Axolotl-Commander-$VERSION" >> "$GITHUB_ENV"

      - name: Test
        run: swift test

      - name: Build universal app
        run: UNIVERSAL=1 scripts/bundle.sh release

      - name: Sign
        if: ${{ env.HAS_CERT == 'true' }}
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # Notarization needs a secure timestamp; a self-signed certificate is signed without one.
          if [ "$HAS_NOTARY" = true ]; then TIMESTAMP=--timestamp; else TIMESTAMP=--timestamp=none; fi
          codesign --force --deep --options runtime "$TIMESTAMP" --sign "$IDENTITY" "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          rm "$RUNNER_TEMP/cert.p12"

      - name: Notarize
        if: ${{ env.HAS_NOTARY == 'true' && env.HAS_CERT == 'true' }}
        env:
          KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$KEY_ID" --issuer "$ISSUER" --wait
          xcrun stapler staple "$APP"
          rm "$RUNNER_TEMP/notary.p8"

      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/$ARTIFACT.zip"
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Axolotl Commander" -srcfolder "$STAGE" -ov -format UDZO "dist/$ARTIFACT.dmg"
          cd dist && shasum -a 256 *.zip *.dmg > SHA256SUMS.txt

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The description is the version's notes in English and Czech; builds that are not
          # notarized start it with the installation steps. Both changelogs go along as assets:
          # the app reads them for its update window (spec 027).
          NOTES="$RUNNER_TEMP/release-notes.md"
          : > "$NOTES"
          if [ "$HAS_NOTARY" != true ] || [ "$HAS_CERT" != true ]; then
            cat .github/release-install.md >> "$NOTES"
            printf '\n' >> "$NOTES"
          fi
          scripts/release-notes.sh "$VERSION" >> "$NOTES"
          cp CHANGELOG.md CHANGELOG.cs.md dist/
          gh release create "$GITHUB_REF_NAME" dist/* --draft --notes-file "$NOTES" \
            --title "Axolotl Commander $VERSION"
