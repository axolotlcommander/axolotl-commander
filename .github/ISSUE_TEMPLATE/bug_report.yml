name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If the bug can lose data, please say so in the title. Please write the report in English;
        discussion in Czech is fine too.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a folder ...
        2. Press F5 ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version (About)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 26.1"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Panels and selection
        - File operations
        - Archives
        - Network (SFTP, FTP)
        - Viewer and editor
        - Search
        - Other
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Volume type (APFS, exFAT, SMB, ...), screenshots, Console.app output. Do not paste passwords or private paths.
